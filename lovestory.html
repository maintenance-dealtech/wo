<script>
(function () {
  var store = JSON.parse(document.getElementById('pages').textContent);
  function dec(b) { return new TextDecoder().decode(Uint8Array.from(atob(b), function (c) { return c.charCodeAt(0); })); }
  var support = dec(document.getElementById('sup').textContent.trim()).replace(/<\/script/gi, '<\\/script');
  var frame = document.getElementById('v');
  function route() {
    var key = (location.hash || '#beranda').slice(1);
    if (!store[key]) { key = 'beranda'; }
    frame.srcdoc = dec(store[key]).replace('__SUPPORT__', function () { return support; });
  }
  window.addEventListener('message', function (e) {
    var k = e.data && e.data.__lsRoute;
    if (!k || !store[k]) { return; }
    if ((location.hash || '#beranda').slice(1) === k) { route(); } else { location.hash = '#' + k; }
  });
  window.addEventListener('hashchange', route);
  route();
})();
</script>
